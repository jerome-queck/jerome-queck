name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install ruff==0.16.6 -r requirements.txt
      - run: ruff format --check scripts tests formal
      - run: ruff check scripts tests formal
      - run: python3 -m unittest discover -s tests
      - run: python3 formal/check.py
      - run: npm install --prefix "$RUNNER_TEMP/profile-browser-runtime" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.62.1 pngjs@7.0.0
      - run: NODE_PATH="$RUNNER_TEMP/profile-browser-runtime/node_modules" node --test .agents/skills/verify/scripts/drive.test.cjs
